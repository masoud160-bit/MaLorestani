plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.assetaudit'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.assetaudit'
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName '2.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
